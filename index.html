<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBER SENSE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0D1424;
            color: #E9E5D8;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 15px;
            letter-spacing: 4px;
            color: #35BBD6;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 30px;
            color: #F5C84C;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        .box {
            border: 2px solid #35BBD6;
            padding: 30px;
            max-width: 500px;
            margin: auto;
        }

        .loading {
            margin-top: 25px;
            color: #F47B35;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <h1>CYBER SENSE</h1>

            <h2>THINK. CHECK. THEN CLICK.</h2>

            <p>
                Chào mừng bạn đến với CYBER SENSE.
            </p>

            <p>
                Một thế giới Pixel nơi những nguy hiểm
                trên Internet được ẩn giấu.
            </p>

            <p class="loading">
                GAME IS COMING SOON...
            </p>

        </div>

    </div>

</body>
</html>
